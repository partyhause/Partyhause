# PartyHause local dev stack: Postgres + Mailpit + API + web.
#
#   docker compose up --build                 (dev stack: Vite web on 5173)
#   npm run web:container                     (web served by nginx, port 8080)
#
#   web (dev)      http://localhost:5173   (Vite dev server, proxies /api)
#   web (container) http://localhost:8080  (nginx serving the built bundle;
#                                            /api proxied to the API through
#                                            the shared network namespace)
#   api            http://localhost:3001/api/health
#   mail UI        http://localhost:8025   (Mailpit; every dev email lands here)
#   db             localhost:5433          (host 5433, so it cannot clash with a local
#                                           Postgres already on 5432)
#
# The API runs prisma generate + migrate deploy before starting, so a fresh db
# is migrated on first boot. JWT_SECRET, INVITATION_TOKEN_SECRET and AUTH_BYPASS
# are dev-defaulted by server/dev-api.ts, which is what `npm run dev:api` runs.
#
# WEB-CONTAINER PROFILE
#   The `web` service here is the Vite dev server. The containerized frontend
#   (`web-container`) is behind a compose profile so `docker compose up` keeps
#   its meaning for everyday development; `npm run web:container` opts in and
#   serves the same production bundle shape the deployed image serves.
#
#   web-container shares the api service's network namespace
#   (network_mode: "service:api"), which is the compose spelling of the
#   combined image's sidecar: nginx.conf's pinned proxy_pass
#   http://localhost:3001 reaches the dev API unmodified. Ports are declared
#   on the netns owner, so the 8080:80 mapping lives on `api` — comment it
#   out to keep the dev stack's published ports exactly as before.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: partyhause
      POSTGRES_PASSWORD: partyhause
      POSTGRES_DB: partyhause
    ports:
      - "5433:5432"
    volumes:
      - ph-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partyhause -d partyhause"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
      # Netns owner for the web-container profile (header note). nginx listens
      # on 80 inside this shared namespace; the host mapping is 8080.
      - "8080:80"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      PORT: "3001"
      NODE_ENV: development
      DATABASE_URL: postgresql://partyhause:partyhause@db:5432/partyhause
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8081
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx tsx watch server/dev-api.ts"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      API_TARGET: http://api:3001
    command: npx vite --host 0.0.0.0 --port 5173
    depends_on:
      - api

volumes:
  ph-db-data:
