# nginx configuration for PartyHause web container (local dev compose).
#
# Serves the pre-built Vite PWA static bundle and proxies /api/* to the
# Django API container on the compose network (partyhause-django:8001).
#
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/css
    text/plain
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ^~ /api/ {
    proxy_pass http://partyhause-django:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~* \.(png|jpe?g|gif|svg|ico|webp|avif|woff2?|mp4|webm)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location ~* \.(js|mjs|cjs|css|json|map|txt|xml|webmanifest)$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ^~ /.well-known/ {
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ^~ /join/ {
    access_log off;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    try_files /index.html =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
