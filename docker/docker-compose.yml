# PartyHause full local dev stack: Postgres + Mailpit + Vite web.
#
#   docker compose up --build        (everything: web + db + mailpit)
#   docker compose up --build web    (web only, needs db already running)
#
# Services:
#   db        PostgreSQL 15, host port 5434 (avoids local Postgres on 5432)
#   mailpit   SMTP :1026, UI :8026  (host 8026 to avoid clash with local Mailpit)
#   web       nginx serving pre-built Vite PWA on :5174
#
# Every service has a healthcheck and restart=unless-stopped so a crashed
# container is detected and restarted automatically.

services:
  partyhause-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: partyhause
      POSTGRES_PASSWORD: partyhause
      POSTGRES_DB: partyhause
    ports:
      - "5434:5432"
    volumes:
      - partyhause-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partyhause -d partyhause"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  partyhause-mailpit:
    image: axllent/mailpit
    ports:
      - "1026:1025"
      - "8026:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8025/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  partyhause-web:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile.dev
    ports:
      - "5174:80"
    environment:
      VITE_API_PROXY_TARGET: http://localhost:8001
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  partyhause-db-data:
