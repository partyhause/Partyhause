name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip-provision:
        description: 'Skip Bicep infrastructure provisioning (images-only deploy)'
        required: false
        type: boolean
        default: false

# Only one deploy at a time per environment. New pushes cancel in-flight runs
# and the latest commit wins.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: rg-partyhause-prod
  ACR_NAME: acrpartyhausek2xoe7s452aja
  ACR_LOGIN_SERVER: acrpartyhausek2xoe7s452aja.azurecr.io
  # Single combined app: nginx serves the PWA and proxies /api/* to the
  # Django API sidecar on localhost:8001 (Dockerfile.combined). One revision
  # update moves both tiers; VITE_API_URL is baked EMPTY for same-origin.
  APP_NAME: ca-app-partyhause-combined
  APP_FQDN: ca-app-partyhause-combined.orangecliff-6cf481f7.eastus2.azurecontainerapps.io
  # The app is reached at the custom domain now that partyhause.uk is bound
  # with a managed certificate. This value is baked into the bundle as
  # VITE_APP_URL, so it is the origin the app reports for itself and the one
  # used to build absolute links; the container FQDN would leak into shared
  # URLs.
  WEB_PUBLIC_URL: https://partyhause.uk
  NODE_VERSION: '22.22.0'
  # Short SHA used to tag images for traceability (also tagged :latest).
  IMAGE_TAG: ${{ github.sha }}

# Required GitHub secrets (set in repo settings → Secrets and variables → Actions):
#   AZURE_CREDENTIALS          — service principal JSON for `azure/login` (Contributor + AcrPush on ACR)
#   POSTGRES_ADMIN_PASSWORD    — PostgreSQL cluster admin password (Bicep @secure param)
#   RESEND_API_KEY             — Resend API key (API container secret)
#   RESEND_FROM_EMAIL          — verified Resend sending address (e.g. "PartyHause <noreply@partyhause.com>")
#   ENTRA_API_CLIENT_SECRET    — Entra External ID (B2C) API app client secret (Bicep @secure param)
#   JWT_SECRET                 - application JWT signing key (at least 32 characters)
#   INVITATION_TOKEN_SECRET    - HMAC key for deterministic RSVP tokens (at least 32 bytes)
#
# Optional (empty until billing is enabled; the server fails closed without them):
#   STRIPE_SECRET_KEY          - Stripe secret key
#   STRIPE_WEBHOOK_SECRET      - Stripe webhook signing secret
#   STRIPE_PRICE_CREATOR       - Stripe price id for the creator plan
#   STRIPE_PRICE_VENDOR        - Stripe price id for the vendor plan
#
# Optional (only needed for first provision or infra changes):
#   AZURE_DEPLOYER_OBJECT_ID   — Object ID of the SP/user granted Key Vault access.
#                                Run: az ad sp show --id <appId> --query id -o tsv
#   ENTRA_TENANT_ID            — B2C tenant id (leave empty until Entra is wired up)
#   ENTRA_API_CLIENT_ID        — B2C API app (server) client id
#   ENTRA_SPA_CLIENT_ID        — B2C SPA app (web) client id
#
# Prerequisites (one-time, manual):
#   1. Create the service principal and grant roles:
#        az ad sp create-for-rbac --name gh-actions-partyhause --role Contributor \
#          --scopes /subscriptions/<subId>/resourceGroups/rg-partyhause-prod \
#          --json-auth > azure-creds.json
#        az role assignment create --assignee <spId> --role AcrPush \
#          --scope /subscriptions/<subId>/resourceGroups/rg-partyhause-prod/providers/Microsoft.ContainerRegistry/registries/acrpartyhausek2xoe7s452aja
#      Paste azure-creds.json contents into the AZURE_CREDENTIALS secret.
#   2. First run: trigger the workflow with skip-provision=false (default) so
#      Bicep provisions/updates the infra. Subsequent runs may set
#      skip-provision=true to deploy only new images (faster).

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: partyhause_ci
          POSTGRES_PASSWORD: partyhause_ci
          POSTGRES_USER: partyhause_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partyhause_ci -d partyhause_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://partyhause_ci:partyhause_ci@localhost:5432/partyhause_ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # --legacy-peer-deps is required. The lockfile is written by a resolver
      # running with that flag; bare `npm ci` recomputes a conflicting tree and
      # fails on picomatch, which looks like a corrupt lockfile and is not one.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # @prisma/client ships as a stub whose types are written by `generate`.
      # Without this, typechecking tsconfig.server.json fails with TS2305
      # "has no exported member 'PrismaClient'". There is no postinstall hook,
      # so `npm ci` alone does not produce it. No database is required.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify database migrations
        run: npm run test:migrations

      - name: Lint code
        run: npm run lint

      # This job previously ran lint and tests only, so the gate protecting
      # production was weaker than the one on pull requests: code that did not
      # typecheck, or that broke the contract audit, could still be built into
      # an image and deployed. build:check runs typecheck (web, node, server,
      # core and mobile), the server/client contract audit, and the vite build.
      - name: Typecheck, contract audit and build
        run: npm run build:check

      - name: Run tests
        run: npm run test:run

      - name: Validate Expo project
        run: npm run doctor:mobile

      - name: Export iOS bundle
        run: npm run build:ios:export

  provision:
    name: Provision / Update infrastructure (Bicep)
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' && github.event.inputs.skip-provision != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Fail fast if application secrets are missing
        # jwtSecret has no default in main.bicep, but an empty GitHub secret would
        # still expand to "" here and provision unusable secret values. Refuse to
        # deploy rather than publish a Container App revision that cannot start.
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INVITATION_TOKEN_SECRET: ${{ secrets.INVITATION_TOKEN_SECRET }}
        run: |
          if [ -z "${JWT_SECRET}" ]; then
            echo "ERROR: JWT_SECRET repository secret is empty or unset."
            echo "Set it under Settings > Secrets and variables > Actions."
            echo "Generate one with: openssl rand -base64 48"
            exit 1
          fi
          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "ERROR: JWT_SECRET is ${#JWT_SECRET} characters; require at least 32."
            exit 1
          fi
          echo "JWT_SECRET present (${#JWT_SECRET} characters)."
          if [ -z "${INVITATION_TOKEN_SECRET}" ]; then
            echo "ERROR: INVITATION_TOKEN_SECRET repository secret is empty or unset."
            echo "Set it under Settings > Secrets and variables > Actions."
            echo "Generate one with: openssl rand -base64 48"
            exit 1
          fi
          if [ "${#INVITATION_TOKEN_SECRET}" -lt 32 ]; then
            echo "ERROR: INVITATION_TOKEN_SECRET is too short; require at least 32 characters."
            exit 1
          fi
          if [ "${INVITATION_TOKEN_SECRET}" = "${JWT_SECRET}" ]; then
            echo "ERROR: INVITATION_TOKEN_SECRET must differ from JWT_SECRET."
            exit 1
          fi
          echo "INVITATION_TOKEN_SECRET present (${#INVITATION_TOKEN_SECRET} characters)."

      - name: Deploy Bicep template (subscription scope)
        # Idempotent: creates/updates the RG + all resources defined in main.bicep.
        # main.bicep is subscription-scoped (it creates the RG itself), so we use
        # `az deployment sub create` with the RG as a parameter (not --resource-group).
        run: |
          az deployment sub create \
            --location eastus2 \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
            --parameters RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            --parameters jwtSecret="${{ secrets.JWT_SECRET }}" \
            --parameters invitationTokenSecret="${{ secrets.INVITATION_TOKEN_SECRET }}" \
            --parameters entraApiClientSecret="${{ secrets.ENTRA_API_CLIENT_SECRET }}" \
            --parameters deployerObjectId="${{ secrets.AZURE_DEPLOYER_OBJECT_ID }}" \
            --parameters stripeSecretKey="${{ secrets.STRIPE_SECRET_KEY }}" \
            --parameters stripeWebhookSecret="${{ secrets.STRIPE_WEBHOOK_SECRET }}" \
            --parameters stripePriceCreator="${{ secrets.STRIPE_PRICE_CREATOR }}" \
            --parameters stripePriceVendor="${{ secrets.STRIPE_PRICE_VENDOR }}" \
            --parameters entraTenantId="${{ secrets.ENTRA_TENANT_ID }}" \
            --parameters entraApiClientId="${{ secrets.ENTRA_API_CLIENT_ID }}" \
            --parameters entraSpaClientId="${{ secrets.ENTRA_SPA_CLIENT_ID }}"

  deploy:
    name: Build & Deploy images to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [build-and-test, provision]
    # Always run if on main; `provision` is skipped when skip-provision=true, and
    # `needs` treats skipped jobs as success.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

        # Vite inlines VITE_* vars at build time, so they MUST be passed as
        # build args here. VITE_API_URL is EMPTY: nginx proxies /api/* to the
        # Django API sidecar, and the browser sends same-origin relative requests
        # (src/lib/apiBase.ts). Omit the VITE_ENTRA_* args: Entra is bundled
        # but inert, and setting them before JWKS validation exists breaks auth.
        # We tag with both :latest and :<sha> for traceability.
        # Using `az acr build` directly for reliable --build-arg support.
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image partyhause-combined:latest \
            --image partyhause-combined:${{ env.IMAGE_TAG }} \
            --file Dockerfile.combined \
            --build-arg VITE_API_URL="" \
            --build-arg VITE_APP_NAME="PartyHause" \
            --build-arg VITE_APP_URL="${{ env.WEB_PUBLIC_URL }}" \
            .

      - name: Update Combined Container App
        # Deploys the SHA-tagged image. One revision update moves both tiers:
        # nginx serves the static bundle on port 80 and proxies /api/* to the
        # sidecar. Secrets and env vars come from Bicep provisioning, the
        # single source of truth — nothing inline here.
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ env.APP_NAME }}
          imageToDeploy: ${{ env.ACR_LOGIN_SERVER }}/partyhause-combined:${{ env.IMAGE_TAG }}
          targetPort: 80
          ingress: external

      - name: Health check (API)
        # Poll the API through the combined app's /api proxy and fail the
        # workflow if it does not return 200 within ~2 minutes.
        run: |
          set -euo pipefail
          URL="https://${{ env.APP_FQDN }}/api/health/"
          echo "Polling $URL ..."
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "API is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: API did not become healthy in time."
          curl -s --max-time 10 "$URL" || true
          exit 1

      - name: Health check (Web)
        # The PWA shell is served by nginx on the same origin; just verify the
        # index returns 200.
        run: |
          set -euo pipefail
          # Container FQDN, not the custom domain: this step checks that the
          # revision we just deployed is serving. Going through the custom
          # domain would also exercise DNS and the managed certificate, so a
          # failure there would be ambiguous about what actually broke.
          URL="https://${{ env.APP_FQDN }}/"
          echo "Polling $URL ..."
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Web is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: Web did not become healthy in time."
          exit 1

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image tag**: \`${{ env.IMAGE_TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **App (combined)**: https://${{ env.APP_FQDN }}/" >> $GITHUB_STEP_SUMMARY
          echo "- **Web PWA**: ${{ env.WEB_PUBLIC_URL }}/" >> $GITHUB_STEP_SUMMARY
          echo "- **API health**: \`https://${{ env.APP_FQDN }}/api/health/\`" >> $GITHUB_STEP_SUMMARY
