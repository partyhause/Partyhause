<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reset your password</title>
</head>
<body>
  <h2>Reset your PartyHause password</h2>
  <p>Hello {{ user.name }},</p>
  <p>Click the link below to reset your password:</p>
  <p><a href="{{ protocol }}://{{ domain }}/auth/reset-password?uid={{ uid }}&token={{ token }}&email={{ user.email }}">Reset Password</a></p>
  <p>This link will expire in 24 hours. If you didn't request a password reset, you can ignore this email.</p>
</body>
</html>
