<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reset your PartyHause password</title>
  <style>
    body { margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #FBFAF9; color: #26201D; line-height: 1.6; }
    .container { max-width: 600px; margin: 48px auto; padding: 32px 24px; background: #FFFFFF; border: 1px solid #EBE7E5; border-radius: 12px; }
    .header { text-align: center; margin-bottom: 24px; }
    .brand { color: #FF5233; font-weight: 700; font-size: 28px; letter-spacing: -0.01em; margin: 0; }
    .tagline { color: #847771; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; margin: 6px 0 0; }
    h1 { color: #26201D; font-size: 22px; margin: 0 0 12px; font-weight: 600; }
    p { margin: 0 0 16px; font-size: 16px; color: #514743; }
    .button { display: inline-block; background: #C02A16; color: #FFFFFF; text-decoration: none; padding: 14px 28px; border-radius: 8px; font-weight: 600; font-size: 16px; margin: 16px 0; }
    .button:hover { background: #EA361A; }
    .footer { margin-top: 32px; padding-top: 20px; border-top: 1px solid #EBE7E5; font-size: 13px; color: #847771; text-align: center; }
    .footer a { color: #FF5233; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <p class="brand">PartyHause</p>
      <p class="tagline">Plan. Party. Perfect.</p>
    </div>
    <h1>Reset your password</h1>
    <p>Hello {{ user.name }},</p>
    <p>Click the button below to reset your PartyHause password:</p>
    <p style="text-align: center;">
      <a href="{{ protocol }}://{{ domain }}/auth/reset-password?uid={{ uid }}&token={{ token }}&email={{ user.email }}" class="button">Reset Password</a>
    </p>
    <p>This link will expire in 24 hours. If you didn't request a password reset, you can ignore this email.</p>
    <div class="footer">
      <p>PartyHause &middot; <a href="{{ protocol }}://{{ domain }}">partyhause.uk</a></p>
    </div>
  </div>
</body>
</html>
